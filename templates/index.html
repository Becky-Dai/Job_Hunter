<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Match AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #analysis h2 { font-size: 1.05rem; font-weight: 700; color: #1e1b4b; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin: 1.2rem 0 0.5rem; }
    #analysis h3 { font-size: 0.95rem; font-weight: 600; color: #4338ca; margin: 0.9rem 0 0.3rem; }
    #analysis ul { list-style: disc; padding-left: 1.4rem; margin: 0.3rem 0; }
    #analysis li { margin: 0.2rem 0; line-height: 1.6; }
    #analysis p { margin: 0.35rem 0; line-height: 1.65; }
    #analysis strong { color: #1e1b4b; }
    #analysis hr { border-color: #e5e7eb; margin: 1rem 0; }
    .spinner { border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%;
               width: 32px; height: 32px; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-indigo-700 text-white px-6 py-3 flex items-center gap-3 flex-shrink-0">
    <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <span class="font-bold text-base">Job Match AI</span>
    <span class="text-indigo-300 text-sm">粘贴 JD · 上传简历 · 一键分析</span>
  </header>

  <!-- Three-panel layout -->
  <div class="flex flex-1 gap-3 p-3 min-h-0">

    <!-- Left: JD input -->
    <div class="flex flex-col w-[34%] bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
        <span class="text-sm font-semibold text-slate-700">职位描述 JD</span>
        <button onclick="clearJd()" class="text-xs text-slate-400 hover:text-slate-600 transition">清空</button>
      </div>
      <textarea id="jdInput"
        placeholder="将 JD 内容粘贴到这里...&#10;&#10;包括职位描述、职责、要求等完整内容。"
        class="flex-1 resize-none p-4 text-sm text-slate-700 placeholder-slate-300 focus:outline-none leading-relaxed"></textarea>
    </div>

    <!-- Middle: Resume upload + button -->
    <div class="flex flex-col w-[20%] gap-3">

      <!-- Upload card -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">上传简历</p>
        <label id="dropzone"
          class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-slate-300
                 hover:border-indigo-400 rounded-lg p-5 cursor-pointer transition text-center">
          <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <span id="fileName" class="text-sm text-slate-400">PDF 或 Word</span>
          <span class="text-xs text-slate-300">点击选择文件</span>
          <input type="file" id="resumeFile" accept=".pdf,.docx" class="hidden" onchange="onFileChange(this)" />
        </label>
      </div>

      <!-- Analyze button -->
      <button id="analyzeBtn" onclick="doAnalyze()"
        class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700
               disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold
               py-3 rounded-xl shadow-sm transition text-sm">
        <svg id="btnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span id="btnText">开始分析</span>
      </button>

      <!-- Error -->
      <div id="errorBox" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

      <!-- Tips -->
      <div class="bg-indigo-50 rounded-xl border border-indigo-100 p-4 text-xs text-indigo-600 space-y-1.5 leading-relaxed">
        <p class="font-semibold text-indigo-700 mb-2">使用提示</p>
        <p>① 将完整 JD 粘贴到左侧</p>
        <p>② 上传你的简历（PDF 或 Word）</p>
        <p>③ 点击"开始分析"</p>
        <p>④ 右侧查看详细分析报告</p>
      </div>
    </div>

    <!-- Right: Analysis + Plan tabs -->
    <div class="flex flex-col flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Tab bar -->
      <div class="flex items-center justify-between border-b border-slate-100 px-2 flex-shrink-0">
        <div class="flex">
          <button id="tabAnalysis" onclick="switchTab('analysis')"
            class="tab-btn px-4 py-2.5 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">
            分析报告
          </button>
          <button id="tabPlan" onclick="switchTab('plan')"
            class="tab-btn px-4 py-2.5 text-sm font-medium text-slate-400 border-b-2 border-transparent
                   disabled:cursor-not-allowed transition" disabled>
            学习计划
          </button>
        </div>
        <button id="downloadBtn" onclick="downloadReport()"
          class="hidden items-center gap-1.5 text-xs text-indigo-600 hover:text-indigo-800
                 border border-indigo-200 hover:border-indigo-400 rounded-lg px-3 py-1.5 mr-1 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          下载
        </button>
      </div>

      <!-- Panel content -->
      <div id="analysisPanel" class="flex-1 overflow-y-auto p-5">
        <div id="emptyState" class="flex flex-col items-center justify-center h-full text-slate-300 gap-3">
          <svg class="w-14 h-14 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <p class="text-sm">分析结果将显示在这里</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    let _analysisMarkdown = "";
    let _planMarkdown = "";
    let _currentTab = "analysis";

    function clearJd() {
      document.getElementById("jdInput").value = "";
    }

    function onFileChange(input) {
      const name = input.files[0]?.name;
      document.getElementById("fileName").textContent = name || "PDF 或 Word";
      document.getElementById("dropzone").classList.toggle("border-indigo-400", !!name);
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.textContent = msg;
      box.classList.remove("hidden");
    }

    function clearError() {
      document.getElementById("errorBox").classList.add("hidden");
    }

    function setLoading(on, label = "分析中...") {
      const btn = document.getElementById("analyzeBtn");
      btn.disabled = on;
      document.getElementById("btnText").textContent = on ? label : "开始分析";
      const icon = document.getElementById("btnIcon");
      if (on) {
        icon.outerHTML = `<div id="btnIcon" style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite"></div>`;
      } else {
        document.getElementById("btnIcon").outerHTML = `<svg id="btnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>`;
      }
    }

    function switchTab(tab) {
      _currentTab = tab;
      const isAnalysis = tab === "analysis";

      // Tab styles
      document.getElementById("tabAnalysis").className =
        `tab-btn px-4 py-2.5 text-sm transition ${isAnalysis
          ? "font-semibold text-indigo-600 border-b-2 border-indigo-600"
          : "font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-600"}`;
      document.getElementById("tabPlan").className =
        `tab-btn px-4 py-2.5 text-sm transition ${!isAnalysis
          ? "font-semibold text-indigo-600 border-b-2 border-indigo-600"
          : "font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-600"}`;

      // Download button label
      const dlBtn = document.getElementById("downloadBtn");

      if (isAnalysis) {
        if (_analysisMarkdown) {
          setPanel(`<div id="analysis" class="text-sm text-slate-700 leading-relaxed">${marked.parse(_analysisMarkdown)}</div>`);
          dlBtn.classList.remove("hidden"); dlBtn.classList.add("flex");
        }
      } else {
        if (_planMarkdown) {
          setPanel(`<div id="plan" class="text-sm text-slate-700 leading-relaxed">${marked.parse(_planMarkdown)}</div>`);
          dlBtn.classList.remove("hidden"); dlBtn.classList.add("flex");
        } else {
          loadPlan();
        }
      }
    }

    function setPanel(html) {
      document.getElementById("analysisPanel").innerHTML = html;
    }

    async function loadPlan() {
      const jd = document.getElementById("jdInput").value.trim();
      const file = document.getElementById("resumeFile").files[0];
      if (!jd || !file) return;

      setPanel(`<div class="flex flex-col items-center justify-center h-full gap-4">
        <div class="spinner"></div>
        <p class="text-slate-400 text-sm">正在生成学习计划（约 30–50 秒）...</p>
      </div>`);
      document.getElementById("downloadBtn").classList.add("hidden");
      document.getElementById("downloadBtn").classList.remove("flex");

      const form = new FormData();
      form.append("resume", file);
      form.append("jd_text", jd);

      try {
        const resp = await fetch("/api/plan", { method: "POST", body: form });
        const data = await resp.json();
        if (!resp.ok) { setPanel(`<p class="text-red-500 text-sm p-4">${data.error || "生成失败，请重试"}</p>`); return; }
        _planMarkdown = data.plan;
        setPanel(`<div id="plan" class="text-sm text-slate-700 leading-relaxed">${marked.parse(_planMarkdown)}</div>`);
        document.getElementById("downloadBtn").classList.remove("hidden");
        document.getElementById("downloadBtn").classList.add("flex");
      } catch {
        setPanel(`<p class="text-red-500 text-sm p-4">网络错误，请重试</p>`);
      }
    }

    async function doAnalyze() {
      clearError();
      const jd = document.getElementById("jdInput").value.trim();
      const file = document.getElementById("resumeFile").files[0];

      if (!jd) return showError("请先粘贴 JD 内容");
      if (!file) return showError("请先上传简历文件");

      // Reset state
      _analysisMarkdown = "";
      _planMarkdown = "";
      switchTab("analysis");
      const planTab = document.getElementById("tabPlan");
      planTab.disabled = true;
      planTab.classList.add("opacity-40", "cursor-not-allowed");

      setLoading(true, "分析中...");
      document.getElementById("downloadBtn").classList.add("hidden");
      document.getElementById("downloadBtn").classList.remove("flex");
      setPanel(`<div class="flex flex-col items-center justify-center h-full gap-4">
        <div class="spinner"></div>
        <p class="text-slate-400 text-sm">正在分析，请稍候（约 20–40 秒）...</p>
      </div>`);

      const form = new FormData();
      form.append("resume", file);
      form.append("jd_text", jd);

      try {
        const resp = await fetch("/api/analyze", { method: "POST", body: form });
        const data = await resp.json();
        if (!resp.ok) { showError(data.error || "分析失败，请重试"); return; }

        _analysisMarkdown = data.analysis;
        setPanel(`<div id="analysis" class="text-sm text-slate-700 leading-relaxed">${marked.parse(data.analysis)}</div>`);
        document.getElementById("downloadBtn").classList.remove("hidden");
        document.getElementById("downloadBtn").classList.add("flex");

        // Enable plan tab
        planTab.disabled = false;
        planTab.classList.remove("opacity-40", "cursor-not-allowed");
      } catch {
        showError("网络错误，请检查连接后重试");
        setPanel(`<div class="flex flex-col items-center justify-center h-full text-slate-300 gap-3"><p class="text-sm">分析失败，请重试</p></div>`);
      } finally {
        setLoading(false);
      }
    }

    function downloadReport() {
      const md = _currentTab === "plan" ? _planMarkdown : _analysisMarkdown;
      if (!md) return;
      const label = _currentTab === "plan" ? "学习计划" : "分析报告";
      const ts = new Date().toISOString().slice(0, 16).replace("T", "_").replace(":", "-");
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${label}_${ts}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>

</body>
</html>
